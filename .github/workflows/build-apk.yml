name: 📱 Build APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "NightcoreFloating.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Extract Android Project
        shell: bash
        run: |
          set -e
          test -f NightcoreFloating.zip
          rm -rf project
          mkdir -p project
          unzip -q NightcoreFloating.zip -d project

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 🤖 Setup Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: 🔎 Find Android Project
        id: find_project
        shell: bash
        run: |
          set -e
          if [ -f project/NightcoreFloating/settings.gradle ]; then
            PROJECT_DIR=project/NightcoreFloating
          elif [ -f project/settings.gradle ]; then
            PROJECT_DIR=project
          else
            PROJECT_DIR=$(find project -maxdepth 3 -name settings.gradle -type f | head -n 1 | xargs -r dirname)
          fi
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using $PROJECT_DIR"

      - name: 🔨 Build APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.find_project.outputs.PROJECT_DIR }}
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 🔍 Locate APK
        id: locate_apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.find_project.outputs.PROJECT_DIR }}
        run: |
          set -e
          APK_PATH=$(find "$PROJECT_DIR" -path '*/build/outputs/apk/debug/*.apk' -type f | head -n 1)
          test -n "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=$(basename "$APK_PATH")" >> "$GITHUB_OUTPUT"
          echo "APK_SIZE=$(du -h "$APK_PATH" | cut -f1)" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_PATH"

      - name: 📤 Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NightcoreFloating-APK
          path: ${{ steps.locate_apk.outputs.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate_apk.outputs.APK_PATH }}
          tag_name: v${{ github.run_number }}
          name: "APK Build #${{ github.run_number }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
