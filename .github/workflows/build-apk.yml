name: 📱 Build APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "NightcoreFloating.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write
      actions: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: '33'
          build-tools: '33.0.2'

      - name: 📦 Extract Android Project
        shell: bash
        run: |
          set -e
          echo "🔍 Checking for NightcoreFloating.zip..."
          
          if [ ! -f "NightcoreFloating.zip" ]; then
            echo "❌ NightcoreFloating.zip not found!"
            exit 1
          fi
          
          echo "✅ Found NightcoreFloating.zip"
          echo "📂 Extracting project..."
          
          rm -rf project/
          mkdir -p project
          unzip -q NightcoreFloating.zip -d project
          
          echo "✅ Extraction complete"
          echo ""
          echo "📋 Project structure:"
          find project -maxdepth 3 -type f -name "*.gradle" -o -name "AndroidManifest.xml" | sort

      - name: 🔎 Find Android Project
        id: find_project
        shell: bash
        run: |
          set -e
          echo "🔍 Searching for Android project..."
          
          if [ -f "project/NightcoreFloating/build.gradle" ]; then
            PROJECT_DIR="project/NightcoreFloating"
            echo "✅ Found at: project/NightcoreFloating"
          elif [ -f "project/build.gradle" ]; then
            PROJECT_DIR="project"
            echo "✅ Found at: project"
          else
            PROJECT_DIR=$(find project -maxdepth 3 -name "build.gradle" -type f | head -n 1 | xargs dirname)
            if [ -z "$PROJECT_DIR" ]; then
              echo "❌ No Android build.gradle found!"
              exit 1
            fi
            echo "✅ Found at: $PROJECT_DIR"
          fi
          
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: ✅ Validate Project Structure
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.find_project.outputs.PROJECT_DIR }}
        run: |
          set -e
          echo "📋 Validating Android project at: $PROJECT_DIR"
          
          if [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "❌ Missing: build.gradle"
            exit 1
          fi
          
          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "❌ Missing: app folder"
            exit 1
          fi
          
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "❌ Missing: app/build.gradle"
            exit 1
          fi
          
          echo "✅ Project structure is valid"
          echo ""
          echo "📂 Project contents:"
          ls -la "$PROJECT_DIR/" | head -20

      - name: 🔓 Make Gradle executable
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.find_project.outputs.PROJECT_DIR }}
        run: |
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            echo "✅ gradlew is now executable"
          else
            echo "ℹ️ gradlew not found, will use system gradle"
          fi

      - name: 🔨 Build APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.find_project.outputs.PROJECT_DIR }}
        run: |
          set -e
          echo "🔨 Building APK..."
          cd "$PROJECT_DIR"
          
          if [ -f "./gradlew" ]; then
            echo "📝 Using local gradlew"
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "📝 Using system gradle"
            gradle assembleDebug --no-daemon --stacktrace
          fi
          
          echo "✅ Build completed"

      - name: 🔍 Locate APK
        id: locate_apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.find_project.outputs.PROJECT_DIR }}
        run: |
          set -e
          echo "🔍 Searching for APK file..."
          
          APK_PATH=$(find "$PROJECT_DIR" -path "*/build/outputs/apk/debug/*.apk" -type f | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK not found at expected location"
            echo "📂 Checking build/outputs structure:"
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || echo "No build outputs found"
            exit 1
          fi
          
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          APK_NAME=$(basename "$APK_PATH")
          
          echo "✅ APK found: $APK_NAME ($APK_SIZE)"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "APK_SIZE=$APK_SIZE" >> "$GITHUB_OUTPUT"
          
          ls -lh "$APK_PATH"

      - name: 📤 Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NightcoreFloating-APK
          path: ${{ steps.locate_apk.outputs.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: 🚀 Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate_apk.outputs.APK_PATH }}
          tag_name: v${{ github.run_number }}
          name: "APK Build #${{ github.run_number }}"
          body: |
            ## 📱 NightcoreFloating APK Build

            **Build Info:**
            - Build Number: #${{ github.run_number }}
            - APK File: ${{ steps.locate_apk.outputs.APK_NAME }}
            - Size: ${{ steps.locate_apk.outputs.APK_SIZE }}
            - Built from commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}

            ### 📥 How to Install
            1. Download the APK file from below
            2. Transfer to your Android phone
            3. Open file manager
            4. Tap the APK
            5. Allow installation from unknown sources if prompted
            6. Done! ✅

          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✨ Build Success Summary
        shell: bash
        env:
          APK_NAME: ${{ steps.locate_apk.outputs.APK_NAME }}
          APK_SIZE: ${{ steps.locate_apk.outputs.APK_SIZE }}
          RELEASE_URL: ${{ steps.create_release.outputs.url }}
        run: |
          echo ""
          echo "╔════════════════════════════════════════╗"
          echo "║       ✅ APK BUILD SUCCESSFUL!         ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
          echo "📱 APK Details:"
          echo "   File: $APK_NAME"
          echo "   Size: $APK_SIZE"
          echo ""
          echo "🔗 Release URL: $RELEASE_URL"
